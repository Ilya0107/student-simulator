name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msbuild:
    name: Windows / MSBuild (Release x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild student-simulator.sln /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal
